apiVersion: 1
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
  # Same uid as the original pgbench lab's datasource, so the Active Session
  # History dashboard works unchanged against the challenge database.
  - name: perflab
    uid: perflab
    type: postgres
    url: db:5432
    user: grafana
    jsonData:
      database: router
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: grafana
