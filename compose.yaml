# The order-routing stack. Start it through ./lab, which adds the active
# challenge's overlay (challenges/NN-*/compose.override.yaml) when there is one.
name: perflab

services:
  db:
    image: postgres:18
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: router
    cpus: 4
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 1g
    stop_grace_period: 3m          # let the shutdown checkpoint finish, even on a slow disk
    ports: ["5440:5432"]
    volumes:
      - dbdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/init/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/init/20-seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./ash/install.sql:/docker-entrypoint-initdb.d/90-ash.sql:ro
      - ./db/init/95-grants.sql:/docker-entrypoint-initdb.d/95-grants.sql:ro
    healthcheck:
      # the init scripts run against a socket-only server; TCP means seeding is done
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d router"]
      interval: 3s
      timeout: 3s
      retries: 200

  exchange-sim:
    build: ./exchange-sim
    cpus: 2
    mem_limit: 512m
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 2s
      retries: 30

  app:
    build: ./app
    environment:
      DB_HOST: db
      SIM_URL: http://exchange-sim:9000
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=50"
    cpus: 4
    mem_limit: 2g
    memswap_limit: 2g
    cap_add: [PERFMON, SYS_PTRACE]     # lets async-profiler use perf_events
    ports: ["8080:8080"]
    volumes:
      - ./results:/results
    depends_on:
      db: {condition: service_healthy}
      exchange-sim: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 3s
      retries: 60

  pg-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@db:5432/router?sslmode=disable
    command: ["--collector.stat_statements", "--collector.stat_bgwriter", "--collector.stat_checkpointer", "--collector.wal"]
    depends_on:
      db: {condition: service_healthy}

  prometheus:
    image: prom/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards/lab:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/ash:ro

volumes:
  dbdata:
  promdata:
